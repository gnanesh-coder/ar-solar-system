<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>AR Solar System</title>

  <!-- A-Frame 1.3.0 + AR.js 3.4.5 (A-Frame build) — 3.4.5 is the release built for A-Frame 1.3.0.
       Pinned on purpose: AR.js "master" now targets A-Frame 1.6 and could break this page. -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #hint, #info {
      position: fixed; left: 50%; transform: translateX(-50%);
      z-index: 10; color: #fff; background: rgba(15, 20, 35, 0.85);
      border-radius: 12px; padding: 10px 16px; text-align: center;
      max-width: 85vw; box-sizing: border-box;
    }
    #hint { top: 16px; font-size: 15px; }
    #hint.found { background: rgba(20, 120, 60, 0.85); }
    #info { bottom: 24px; display: none; font-size: 14px; line-height: 1.4; }
    #info h3 { margin: 0 0 4px; font-size: 17px; }
    #info button {
      margin-top: 8px; border: 0; border-radius: 8px; padding: 6px 14px;
      background: #fff; color: #111; font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="hint">📷 Point your camera at the Hiro marker</div>
  <div id="info">
    <h3 id="info-title"></h3>
    <div id="info-text"></div>
    <button onclick="document.getElementById('info').style.display='none'">Close</button>
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <a-marker id="marker" preset="hiro" smooth="true" smoothCount="5" smoothTolerance="0.01">
      <!-- Whole system sits slightly above the marker -->
      <a-entity position="0 0.4 0" scale="0.55 0.55 0.55">

        <a-entity light="type: ambient; intensity: 0.5"></a-entity>
        <a-entity light="type: point; intensity: 1.6; distance: 10" position="0 0 0"></a-entity>

        <!-- Sun -->
        <a-sphere class="clickable" data-name="Sun"
          radius="0.35" color="#FDB813"
          material="emissive: #FF8C00; emissiveIntensity: 0.9"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
        </a-sphere>

        <!-- Planets are generated by the script below -->
        <a-entity id="planets"></a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // name, orbit radius, size, colour, orbit time (ms), fact
    const PLANETS = [
      ["Mercury", 0.6, 0.05, "#9e9e9e", 4000,  "Smallest planet; a year lasts just 88 Earth days."],
      ["Venus",   0.8, 0.08, "#e6c27a", 7000,  "Hottest planet (~465 °C) due to a runaway greenhouse effect."],
      ["Earth",   1.05,0.085,"#2e86de", 10000, "The only known planet with liquid surface water and life."],
      ["Mars",    1.3, 0.065,"#c1440e", 15000, "Home to Olympus Mons, the tallest volcano in the solar system."],
      ["Jupiter", 1.7, 0.2,  "#d8a46c", 24000, "Largest planet; its Great Red Spot is a storm bigger than Earth."],
      ["Saturn",  2.15,0.17, "#e3d19c", 32000, "Its rings are made mostly of ice and rock particles."],
    ];
    const FACTS = { Sun: "A G-type star holding 99.8% of the solar system's mass." };

    const root = document.getElementById("planets");

    PLANETS.forEach(([name, r, size, color, dur, fact]) => {
      FACTS[name] = fact;

      // Orbit ring (flat on the marker plane)
      const ring = document.createElement("a-ring");
      ring.setAttribute("radius-inner", r - 0.005);
      ring.setAttribute("radius-outer", r + 0.005);
      ring.setAttribute("rotation", "-90 0 0");
      ring.setAttribute("material", "color: #ffffff; opacity: 0.35; transparent: true; side: double");
      root.appendChild(ring);

      // Pivot rotates around the sun; the planet sits at distance r
      // Random start angle; end exactly one full turn later so the loop restarts without a jump
      const start = Math.random() * 360;
      const pivot = document.createElement("a-entity");
      pivot.setAttribute("rotation", `0 ${start} 0`);
      pivot.setAttribute("animation",
        `property: rotation; from: 0 ${start} 0; to: 0 ${start + 360} 0; loop: true; dur: ${dur}; easing: linear`);

      const planet = document.createElement("a-sphere");
      planet.setAttribute("radius", size);
      planet.setAttribute("color", color);
      planet.setAttribute("position", `${r} 0 0`);
      planet.setAttribute("class", "clickable");
      planet.dataset.name = name;

      if (name === "Saturn") {
        const sRing = document.createElement("a-ring");
        sRing.setAttribute("radius-inner", size * 1.3);
        sRing.setAttribute("radius-outer", size * 2.1);
        sRing.setAttribute("rotation", "-70 0 0");
        sRing.setAttribute("material", "color: #cdb88a; opacity: 0.8; transparent: true; side: double");
        planet.appendChild(sRing);
      }

      const label = document.createElement("a-text");
      label.setAttribute("value", name);
      label.setAttribute("align", "center");
      label.setAttribute("color", "#ffffff");
      label.setAttribute("width", 2);
      label.setAttribute("side", "double");
      label.setAttribute("position", `0 ${size + 0.08} 0`);
      planet.appendChild(label);

      pivot.appendChild(planet);
      root.appendChild(pivot);
    });

    // Tap a planet or the sun to see a fact
    document.querySelector("a-scene").addEventListener("click", (e) => {
      const name = e.target && e.target.dataset && e.target.dataset.name;
      if (!name) return;
      document.getElementById("info-title").textContent = name;
      document.getElementById("info-text").textContent = FACTS[name];
      document.getElementById("info").style.display = "block";
    });

    // Marker status hint
    const hint = document.getElementById("hint");
    const marker = document.getElementById("marker");
    marker.addEventListener("markerFound", () => {
      hint.textContent = "✅ Marker found — tap a planet!";
      hint.classList.add("found");
    });
    marker.addEventListener("markerLost", () => {
      hint.textContent = "📷 Point your camera at the Hiro marker";
      hint.classList.remove("found");
    });
  </script>
</body>
</html>
